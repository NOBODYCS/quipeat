<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191c23">
  <title>{% block title %}Quipeat{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body class="h-full text-slate-100 antialiased font-sans">
  {% if user %}
  <header class="sticky top-0 z-20 border-b border-ink-700 bg-ink-900/85 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3 flex items-center gap-2">
      <a href="/decks" class="mr-2 flex items-center gap-2">
        <span class="grid h-8 w-8 place-items-center rounded-xl bg-volt-400 text-lg font-extrabold text-ink-950 shadow-btn">Q</span>
        <span class="text-lg font-extrabold tracking-tight text-white">Quipeat</span>
      </a>
      <nav class="hidden md:flex items-center gap-1 ml-4">
        <a href="/decks" class="navlink">Decks</a>
        <a href="/new" class="navlink">New</a>
        <a href="/study" class="navlink">Study</a>
        <a href="/stats" class="navlink">Stats</a>
      </nav>
      <div class="ml-auto flex items-center gap-2">
        <span class="chip hidden sm:inline-flex">Lvl {{ user.level }}</span>
        <span class="chip chip-volt hidden sm:inline-flex">{{ user.xp_total }} XP{% if user.streak_days > 0 %} · 🔥{{ user.streak_days }}{% endif %}</span>
        <a href="/onboarding?replay=1" class="navlink !px-2.5 hidden sm:block" title="Replay tutorial">❓</a>
        <a href="/settings" class="navlink !px-2.5">⚙</a>
        <form method="post" action="/logout"><button class="navlink !text-slate-400">Log out</button></form>
      </div>
    </div>
  </header>
  {% endif %}
  <main class="mx-auto max-w-5xl px-4 pt-6 {% if user %}pb-24 md:pb-10{% endif %}">
    {% block content %}{% endblock %}
  </main>
  {% if user %}
  <nav class="fixed bottom-0 inset-x-0 z-20 border-t border-ink-700 bg-ink-900/95 backdrop-blur md:hidden">
    <div class="mx-auto max-w-5xl grid grid-cols-4">
      <a href="/decks" class="tablink {% if request.url.path.startswith('/decks') %}tablink-active{% endif %}"><span>🗂</span>Decks</a>
      <a href="/new" class="tablink {% if request.url.path == '/new' %}tablink-active{% endif %}"><span>＋</span>New</a>
      <a href="/study" class="tablink {% if request.url.path.startswith('/study') %}tablink-active{% endif %}"><span>🎯</span>Study</a>
      <a href="/stats" class="tablink {% if request.url.path == '/stats' %}tablink-active{% endif %}"><span>📊</span>Stats</a>
    </div>
  </nav>
  {% endif %}
</body>
</html>
