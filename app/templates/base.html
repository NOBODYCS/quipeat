<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Quipeat{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  {% if user %}
  <nav class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-10 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3 flex items-center gap-4">
      <a href="/decks" class="text-lg font-bold text-emerald-400">Quipeat</a>
      <a href="/decks" class="text-sm text-slate-300 hover:text-white">Decks</a>
      <a href="/new" class="text-sm text-slate-300 hover:text-white">New source</a>
      <a href="/study" class="text-sm text-slate-300 hover:text-white">Study</a>
      <a href="/stats" class="text-sm text-slate-300 hover:text-white">Stats</a>
      <div class="ml-auto flex items-center gap-3">
        <span class="text-xs text-slate-400">Lvl {{ user.level }} · {{ user.xp_total }} XP{% if user.streak_days > 0 %} · 🔥 {{ user.streak_days }}{% endif %}</span>
        <a href="/settings" class="text-sm text-slate-300 hover:text-white">Settings</a>
        <form method="post" action="/logout"><button class="text-sm text-slate-400 hover:text-white">Log out</button></form>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
