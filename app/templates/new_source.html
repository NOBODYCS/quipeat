{% extends "base.html" %}
{% block title %}New source · Quipeat{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="text-2xl font-bold mb-6">Create a quiz deck from a source</h1>
  {% if error %}<div class="mb-4 rounded-lg bg-red-950/60 border border-red-800 px-4 py-2 text-sm text-red-300">{{ error }}</div>{% endif %}
  <form method="post" action="/new" enctype="multipart/form-data" class="space-y-4 rounded-xl border border-slate-800 bg-slate-900 p-5">
    <div>
      <label for="title" class="block text-sm mb-1">Deck title</label>
      <input id="title" name="title" type="text" placeholder="e.g. Photosynthesis basics"
             class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 focus:border-emerald-500 focus:outline-none">
    </div>
    <div>
      <label for="file" class="block text-sm mb-1">Upload a document (PDF, DOCX, TXT, MD)</label>
      <input id="file" name="file" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.csv"
             class="w-full text-sm text-slate-400 file:mr-3 file:rounded-lg file:border-0 file:bg-slate-800 file:px-3 file:py-1.5 file:text-slate-200">
    </div>
    <div class="text-center text-xs text-slate-500">— or —</div>
    <div>
      <label for="url" class="block text-sm mb-1">Link to an online document / article</label>
      <input id="url" name="url" type="url" placeholder="https://…"
             class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 focus:border-emerald-500 focus:outline-none">
    </div>
    <div class="text-center text-xs text-slate-500">— or —</div>
    <div>
      <label for="topic_text" class="block text-sm mb-1">Paste text or describe the topic</label>
      <textarea id="topic_text" name="topic_text" rows="6" placeholder="Paste any material about the topic…"
                class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 focus:border-emerald-500 focus:outline-none"></textarea>
    </div>
    <button type="submit" class="w-full rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-2">Generate questions</button>
  </form>
</div>
{% endblock %}
