{% extends "base.html" %}
{% block title %}New deck · Quipeat{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="text-2xl font-extrabold mb-6">{{ t("new_title") }}</h1>
  {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/new" enctype="multipart/form-data" class="card p-5 space-y-5">
      <input type="hidden" name="csrf" value="{{ csrf }}">
    <div>
      <label for="title" class="label">{{ t("deck_title_label") }}</label>
      <input id="title" name="title" type="text" value="{{ title or '' }}" placeholder="{{ t("deck_title_ph") }}" class="input">
    </div>
    <div>
      <label for="goal" class="label">{{ t("goal_label") }} <span class="text-red-400">*</span></label>
      <textarea id="goal" name="goal" rows="3" required
                placeholder="{{ t("goal_ph") }}" class="input">{% if goal %}{{ goal }}{% endif %}</textarea>
    </div>
    <div>
      <label for="files" class="label">{{ t("materials_files_label") }} <span class="text-red-400">*</span></label>
      <input id="files" name="files" type="file" multiple accept=".pdf,.docx,.txt,.md,.markdown,.csv"
             class="w-full text-sm text-mist-400 file:mr-3 file:btn-ghost file:btn-sm file:text-xs">
      <p class="mt-1 text-xs text-mist-400">{{ t("materials_files_hint") }}</p>
    </div>
    <div>
      <label for="urls" class="label">{{ t("materials_urls_label") }}</label>
      <textarea id="urls" name="urls" rows="3" placeholder="{{ t("materials_urls_ph") }}" class="input"></textarea>
      <p class="mt-1 text-xs text-mist-400">{{ t("materials_urls_hint") }}</p>
    </div>
    <div>
      <label for="lang" class="label">{{ t("lang_label") }}</label>
      <select id="lang" name="lang" class="input">
        <option value="en" {% if lang == "en" %}selected{% endif %}>🇬🇧 English</option>
        <option value="pl" {% if lang == "pl" %}selected{% endif %}>🇵🇱 Polski</option>
      </select>
    </div>
    <div>
      <label for="level" class="label">{{ t("level_label") }}</label>
      <select id="level" name="level" class="input">
        <option value="quick">{{ t("level_quick") }}</option>
        <option value="standard" selected>{{ t("level_standard") }}</option>
        <option value="thorough">{{ t("level_thorough") }}</option>
      </select>
      <p class="mt-1 text-xs text-mist-400">{{ t("level_hint") }}</p>
    </div>
    <div>
      <label for="target" class="label">{{ t("target_label") }}</label>
      <select id="target" name="target" class="input">
        {% for n in target_choices %}<option value="{{ n }}" {% if n == default_target %}selected{% endif %}>{{ n }} {{ t("questions_n") }}</option>{% endfor %}
      </select>
      <p class="mt-1 text-xs text-mist-400">{{ t("target_hint") }}</p>
    </div>
    <button type="submit" class="btn-primary w-full">{{ t("generate_btn") }}</button>
  </form>
</div>
{% endblock %}
