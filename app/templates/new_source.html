{% extends "base.html" %}
{% block title %}New source · Quipeat{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="text-2xl font-extrabold mb-6">{{ t("new_title") }}</h1>
  {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/new" enctype="multipart/form-data" class="card p-5 space-y-5">
    <div>
      <label for="title" class="label">{{ t("deck_title_label") }}</label>
      <input id="title" name="title" type="text" placeholder="{{ t("deck_title_ph") }}" class="input">
    </div>
    <div role="tablist" aria-label="{{ t('source') }}" class="grid grid-cols-3 gap-1 rounded-xl bg-ink-900 border border-ink-700 p-1">
      <button type="button" role="tab" aria-selected="true" data-src-tab="file" class="src-tab rounded-lg px-3 py-2 text-sm font-bold">
        <svg class="inline h-4 w-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0-12 4 4m-4-4L8 7"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>{{ t("source_kind_file") }}</button>
      <button type="button" role="tab" aria-selected="false" data-src-tab="url" class="src-tab rounded-lg px-3 py-2 text-sm font-bold">
        <svg class="inline h-4 w-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 18.5"/></svg>{{ t("source_kind_url") }}</button>
      <button type="button" role="tab" aria-selected="false" data-src-tab="text" class="src-tab rounded-lg px-3 py-2 text-sm font-bold">
        <svg class="inline h-4 w-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>{{ t("source_topic") }}</button>
    </div>
    <div data-src-panel="file">
      <label for="file" class="label">{{ t("upload_label") }}</label>
      <input id="file" name="file" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.csv"
             class="w-full text-sm text-mist-400 file:mr-3 file:btn-ghost file:btn-sm file:text-xs">
    </div>
    <div data-src-panel="url" class="hidden">
      <label for="url" class="label">{{ t("url_label") }}</label>
      <input id="url" name="url" type="url" placeholder="https://…" class="input">
    </div>
    <div data-src-panel="text" class="hidden">
      <label for="topic_text" class="label">{{ t("text_label") }}</label>
      <textarea id="topic_text" name="topic_text" rows="6" placeholder="{{ t("text_ph") }}" class="input"></textarea>
    </div>
    <div>
      <label for="lang" class="label">{{ t("lang_label") }}</label>
      <select id="lang" name="lang" class="input">
        <option value="en" {% if lang == "en" %}selected{% endif %}>🇬🇧 English</option>
        <option value="pl" {% if lang == "pl" %}selected{% endif %}>🇵🇱 Polski</option>
      </select>
    </div>
    <div>
      <label for="level" class="label">{{ t("level_label") }}</label>
      <select id="level" name="level" class="input">
        <option value="quick">{{ t("level_quick") }}</option>
        <option value="standard" selected>{{ t("level_standard") }}</option>
        <option value="thorough">{{ t("level_thorough") }}</option>
      </select>
      <p class="mt-1 text-xs text-mist-400">{{ t("level_hint") }}</p>
    </div>
    <button type="submit" class="btn-primary w-full">{{ t("generate_btn") }}</button>
  </form>
</div>
<script>
  document.querySelectorAll('.src-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.src-tab').forEach(function (t2) {
        var active = t2 === tab;
        t2.setAttribute('aria-selected', active ? 'true' : 'false');
        t2.className = t2.className.replace(/ (bg-volt-400|text-ink-950|text-mist-400)/g, '');
        t2.className += active ? ' bg-volt-400 text-ink-950' : ' text-mist-400';
      });
      document.querySelectorAll('[data-src-panel]').forEach(function (p) {
        p.classList.toggle('hidden', p.getAttribute('data-src-panel') !== tab.getAttribute('data-src-tab'));
      });
    });
  });
  document.querySelector('.src-tab').click();
</script>
{% endblock %}
