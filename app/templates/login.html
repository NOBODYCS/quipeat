{% extends "base.html" %}
{% block title %}Log in · Quipeat{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm mt-8 md:mt-16">
  <div class="card p-6 md:p-8">
    <div class="mb-6 flex items-center gap-3">
      <span class="grid h-10 w-10 place-items-center rounded-2xl bg-volt-400 text-xl font-extrabold text-ink-950 shadow-btn">Q</span>
      <div>
        <h1 class="text-xl font-extrabold">Sign in</h1>
        <p class="text-xs text-slate-400">Welcome back.</p>
      </div>
    </div>
    {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label for="email" class="label">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required class="input">
      </div>
      <div>
        <label for="password" class="label">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="input">
      </div>
      <button type="submit" class="btn-primary w-full">Sign in</button>
    </form>
    {% if passkeys_enabled %}
    <button id="passkey-login" class="btn-ghost mt-3 w-full">Use a passkey</button>
    {% endif %}
    <p class="mt-4 text-sm text-slate-400 text-center">No account? <a href="/register" class="text-volt-300 font-semibold hover:underline">Create account</a></p>
  </div>
</div>
{% endblock %}
