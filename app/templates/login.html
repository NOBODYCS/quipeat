{% extends "base.html" %}
{% block title %}Log in · Quipeat{% endblock %}
{% block content %}
<div class="relative mx-auto max-w-sm mt-8 md:mt-16">  <div class="absolute top-3 right-3">
    <form method="post" action="/settings/lang">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="lang" value="{{ 'pl' if lang == 'en' else 'en' }}">
      <button class="iconbtn !h-8 !w-8 !border-0 !bg-transparent text-lg" title="{{ t('site_language') }}" aria-label="{{ t('site_language') }}">{{ '🇵🇱' if lang == 'en' else '🇬🇧' }}</button>
    </form>
  </div>

  <div class="card p-6 md:p-8">
    <div class="mb-6 flex items-center gap-3">
      <span class="grid h-10 w-10 place-items-center rounded-2xl bg-volt-400 text-xl font-extrabold text-ink-950 shadow-btn">Q</span>
      <div>
        <h1 class="text-xl font-extrabold">{{ t("signin") }}</h1>
        <p class="text-xs text-mist-400">{{ t("welcome_back") }}</p>
      </div>
    </div>
    {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div>
        <label for="email" class="label">{{ t("email") }}</label>
        <input id="email" name="email" type="email" autocomplete="username" required class="input">
      </div>
      <div>
        <label for="password" class="label">{{ t("password") }}</label>
        <div class="relative"><input id="password" name="password" type="password" autocomplete="current-password" required class="input">
        <button type="button" class="iconbtn !h-8 !w-8 absolute right-1.5 top-1/2 -translate-y-1/2 !border-0 !bg-transparent" onclick="var i=document.getElementById('password'); i.type = i.type==='password'?'text':'password'; this.firstElementChild.style.display = i.type==='password'?'':'none';" aria-label="Show/hide password"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg></button></div>
      </div>
      <button type="submit" class="btn-primary w-full">{{ t("signin") }}</button>
    </form>
    {% if passkeys_enabled %}
    <button id="passkey-login" type="button" class="btn-ghost mt-3 w-full">{{ t("passkey") }}</button>
    <script>
    document.getElementById('passkey-login').addEventListener('click', async function () {
      var btn = this; btn.disabled = true;
      try {
        var opts = await (await fetch('/passkeys/login-options')).json();
        opts.challenge = Uint8Array.from(atob(opts.challenge.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
        for (var c of (opts.allowCredentials || [])) c.id = Uint8Array.from(atob(c.id.replace(/-/g, '+').replace(/_/g, '/')), ch => ch.charCodeAt(0));
        var cred = await navigator.credentials.get({ publicKey: opts });
        var body = {
          id: cred.id,
          rawId: btoa(String.fromCharCode(...new Uint8Array(cred.rawId))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
          challenge: btoa(String.fromCharCode(...new Uint8Array(opts.challenge))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
          type: cred.type,
          response: {
            authenticatorData: btoa(String.fromCharCode(...new Uint8Array(cred.response.authenticatorData))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
            clientDataJSON: btoa(String.fromCharCode(...new Uint8Array(cred.response.clientDataJSON))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
            signature: btoa(String.fromCharCode(...new Uint8Array(cred.response.signature))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
            userHandle: cred.response.userHandle ? btoa(String.fromCharCode(...new Uint8Array(cred.response.userHandle))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : null,
          },
        };
        var r = await fetch('/passkeys/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (r.ok) { window.location.href = '/decks'; return; }
        btn.disabled = false;
      } catch (e) { btn.disabled = false; }
    });
    </script>
    {% endif %}
    <p class="mt-4 text-sm text-mist-400 text-center">{{ t("no_account") }} <a href="/register" class="text-volt-300 font-semibold hover:underline">{{ t("create_account") }}</a></p>
  </div>
</div>
{% endblock %}
