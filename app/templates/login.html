{% extends "base.html" %}
{% block title %}Log in · Quipeat{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm mt-10">
  <h1 class="text-2xl font-bold mb-1">Log in</h1>
  <p class="text-sm text-slate-400 mb-6">Welcome back.</p>
  {% if error %}<div class="mb-4 rounded-lg bg-red-950/60 border border-red-800 px-4 py-2 text-sm text-red-300">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label for="email" class="block text-sm mb-1">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required
             class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 focus:border-emerald-500 focus:outline-none">
    </div>
    <div>
      <label for="password" class="block text-sm mb-1">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 focus:border-emerald-500 focus:outline-none">
    </div>
    <button type="submit" class="w-full rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-2">Log in</button>
  </form>
  {% if passkeys_enabled %}
  <button id="passkey-login" class="mt-3 w-full rounded-lg border border-slate-700 py-2 text-sm">Use a passkey</button>
  {% endif %}
  <p class="mt-4 text-sm text-slate-400">No account? <a href="/register" class="text-emerald-400 hover:underline">Register</a></p>
</div>
{% endblock %}
