{% extends "base.html" %}
{% block title %}Register · Quipeat{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm mt-8 md:mt-16">
  <div class="card p-6 md:p-8">
    <div class="mb-6 flex items-center gap-3">
      <span class="grid h-10 w-10 place-items-center rounded-2xl bg-volt-400 text-xl font-extrabold text-ink-950 shadow-btn">Q</span>
      <div>
        <h1 class="text-xl font-extrabold">{{ t("register_title") }}</h1>
        <p class="text-xs text-slate-400">{{ t("register_sub") }}</p>
      </div>
    </div>
    {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="space-y-4">
      <div>
        <label for="display_name" class="label">{{ t("display_name") }}</label>
        <input id="display_name" name="display_name" type="text" autocomplete="nickname" class="input">
      </div>
      <div>
        <label for="email" class="label">{{ t("email") }}</label>
        <input id="email" name="email" type="email" autocomplete="email" required class="input">
      </div>
      <div>
        <label for="password" class="label">{{ t("password_min") }}</label>
        <div class="relative"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" class="input">
        <button type="button" class="iconbtn !h-8 !w-8 absolute right-1.5 top-1/2 -translate-y-1/2 !border-0 !bg-transparent" onclick="var i=document.getElementById(\'password\'); i.type = i.type===\'password\'?\'text\':\'password\'; this.textContent = i.type===\'password\'?\'👁\':\'🙈\';" aria-label="Show/hide password">👁</button></div>
      </div>
      <button type="submit" class="btn-primary w-full">{{ t("create_account") }}</button>
    </form>
    <p class="mt-4 text-sm text-slate-400 text-center">{{ t("have_account") }} <a href="/login" class="text-volt-300 font-semibold hover:underline">{{ t("signin") }}</a></p>
  </div>
</div>
{% endblock %}
