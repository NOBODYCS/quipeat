{% extends "base.html" %}
{% block title %}Study · Quipeat{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">{{ t("study_pick_title") }}</h1>
{% if not decks %}
<div class="rounded-xl border border-dashed border-slate-700 p-10 text-center text-slate-400">{{ t("empty_study") }}</div>
{% else %}
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  {% for d in decks %}
  <a href="/study/{{ d.id }}" class="rounded-xl border border-slate-800 bg-slate-900 p-4 hover:border-emerald-600 transition">
    <div class="font-semibold mb-1 truncate">{{ d.title }}</div>
    <span class="text-xs rounded bg-emerald-900/60 text-emerald-300 px-2 py-0.5">{{ d.due }} {{ t("due_n") }}</span>
  </a>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
