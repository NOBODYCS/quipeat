services:
  quipeat:
    # Prebuilt image from GHCR (pushed by .github/workflows/docker-ghcr.yml on merge to main):
    # image: ghcr.io/nobodycs/quipeat:latest
    # To build from source instead (no GHCR pull needed), keep `build: .` and comment the image line.
    build: .
    container_name: quipeat
    restart: unless-stopped
    env_file: .env
    volumes:
      - quipeat-data:/app/data
    ports:
      # LAN only. Left side is the HOST (outside/reverse-proxy) port — deliberately
      # obscure; the container always listens on 8000 internally. Override with
      # QUIPEAT_LAN_BIND, e.g. QUIPEAT_LAN_BIND=0.0.0.0:41773:8000 for LAN-wide access.
      - "${QUIPEAT_LAN_BIND:-127.0.0.1:37411:8000}:8000"

volumes:
  quipeat-data:
