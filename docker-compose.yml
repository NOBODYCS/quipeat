services:
  quipeat:
    # Prebuilt image from GHCR (pushed by .github/workflows/docker-ghcr.yml on merge to main):
    # image: ghcr.io/nobodycs/quipeat:latest
    # To build from source instead (no GHCR pull needed), keep `build: .` and comment the image line.
    build: .
    container_name: quipeat
    restart: unless-stopped
    env_file: .env
    volumes:
      - quipeat-data:/app/data
    ports:
      # LAN only. Left side is the host port — set QUIPEAT_LAN_BIND to any free
      # host port, e.g. QUIPEAT_LAN_BIND=127.0.0.1:37411:8000 (host 37411 -> container 8000).
      # The container always listens on 8000 internally; only the host side changes.
      - "${QUIPEAT_LAN_BIND:-127.0.0.1:8000}:8000"

volumes:
  quipeat-data:
